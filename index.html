<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darling Editor | Pro Edition</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 5px 15px;
            border-radius: 8px;
        }
        #page-num-display {
            font-weight: bold;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="editor-header">
        <div class="logo">DARLING</div>
        <div class="toolbar">
            <input type="file" id="file-upload" accept=".pdf,image/*" hidden>
            <label for="file-upload" class="btn-tool">Cargar Archivo</label>
            
            <div class="divider"></div>
            
            <div class="nav-controls">
                <button class="btn-tool secondary" id="prev-page">◀</button>
                <span id="page-num-display">Pág: 0 / 0</span>
                <button class="btn-tool secondary" id="next-page">▶</button>
            </div>

            <div class="divider"></div>
            
            <button class="btn-tool secondary" id="add-text-btn">+ Texto</button>
            <button class="btn-tool" id="export-btn">Exportar PDF</button>
        </div>
    </header>

    <main id="editor-container">
        <div id="drop-zone">
            <p>Arrastra tu manual aquí</p>
        </div>
        <div id="canvas-wrapper"></div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
